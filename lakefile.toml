name = "elemental-peeling-lean"
version = "1.0.0"
defaultTargets = ["ElementalFoundations", "PauliMemory", "Hypersurface", "LoopWall"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Every module keeps its original name and bytes (see PROVENANCE.md).
[[lean_lib]]
name = "ElementalFoundations"
roots = ["ElementalFoundations", "ElementalForceRecovery", "ElementalBoundaryLedger"]

[[lean_lib]]
name = "PauliMemory"

[[lean_lib]]
name = "Hypersurface"
roots = ["Hypersurface"]

# The loop-wall layer: the peel reflection, the wall, and the archive certificate.
[[lean_lib]]
name = "LoopWall"
roots = ["LoopWall"]
